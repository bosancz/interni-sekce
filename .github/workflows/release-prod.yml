name: Release to PROD

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Version bump"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # TODO:
  # test:
  #   name: Test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Tests not implemented yet
  #       run: echo "No tests implemented yet"

  version:
    name: Resolve version
    uses: ./.github/workflows/version.yml
    with:
      semver: ${{ github.event.inputs.semver }}

  build:
    name: Build and publish
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      context: .
      image-name: bosancz/interni-sekce
      registry: ghcr.io
      tag: latest
      version: ${{ needs.version.outputs.new_tag }}
      # the changelog section is written into the tree the image is built from and pushed to master
      # once the image is published; the resulting commit is what gets tagged
      changelog-version: ${{ needs.version.outputs.new_tag }}
      changelog-branch: master
      build-args: |
        VERSION=${{ needs.version.outputs.new_tag }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      images: ${{ needs.build.outputs.images }}
    secrets: inherit

  tag:
    name: Tag release
    needs:
      - version
      - build
    uses: ./.github/workflows/tag.yml
    with:
      tag: PROD
      version: ${{ needs.version.outputs.new_tag }}
      ref: ${{ needs.build.outputs.sha }}
