name: Clean up untagged images

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cleanup:
    name: Delete untagged image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_PATH: ${{ github.event.repository.owner.type == 'User' && 'users' || 'orgs' }}/${{ github.repository_owner }}
    steps:
      - name: Delete untagged APP image versions
        run: |
          base="/$OWNER_PATH/packages/container/interni-sekce/versions"
          ids=$(gh api --paginate "$base?per_page=100" --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          echo "Deleting $(echo -n "$ids" | grep -c . || true) untagged versions"
          for id in $ids; do
            gh api --method DELETE "$base/$id" --silent
            sleep 1
          done

      - name: Delete untagged WORKER image versions
        run: |
          base="/$OWNER_PATH/packages/container/interni-sekce-worker/versions"
          ids=$(gh api --paginate "$base?per_page=100" --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          echo "Deleting $(echo -n "$ids" | grep -c . || true) untagged versions"
          for id in $ids; do
            gh api --method DELETE "$base/$id" --silent
            sleep 1
          done
