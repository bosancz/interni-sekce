name: Clean up untagged images

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "JSON array of container packages to clean up"
        type: string
        required: true
        default: '["interni-sekce", "interni-sekce-worker"]'
  workflow_call:
    inputs:
      packages:
        description: "JSON array of container packages to clean up"
        type: string
        required: true

jobs:
  cleanup:
    name: Delete untagged ${{ matrix.package }} versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0
