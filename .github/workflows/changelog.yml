name: Update changelog

on:
  workflow_call:
    inputs:
      version:
        description: "Version to record in the changelog (e.g. v1.2.3)"
        type: string
        required: true
      ref:
        description: "Branch to update"
        type: string
        required: false
        default: master
    outputs:
      sha:
        description: "Commit SHA that includes the updated changelog"
        value: ${{ jobs.changelog.outputs.sha }}

permissions:
  contents: write

jobs:
  changelog:
    name: Update changelog
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so the generator can diff since the previous tag
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate changelog
        run: node scripts/generate-changelog.mjs --new-tag "${{ inputs.version }}"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes to commit."
          else
            git add CHANGELOG.md
            git commit -m "chore(release): update changelog for ${{ inputs.version }} [skip ci]"
            git push origin HEAD:${{ inputs.ref }}
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
