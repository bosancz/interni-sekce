name: Release to NEXT

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # TODO:
  # test:
  #   name: Test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Tests not implemented yet
  #       run: echo "No tests implemented yet"

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_short_sha.outputs.short_sha }}
    steps:
      - name: Set short SHA
        id: set_short_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-app:
    name: Build APP
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      context: .
      target: app
      image-name: bosancz/interni-sekce
      registry: ghcr.io
      tag: next
      changelog-version: NEXT-${{ needs.version.outputs.version }}
      build-args: |
        VERSION=NEXT-${{ needs.version.outputs.version }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  build-worker:
    name: Build WORKER
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      context: .
      target: worker
      image-name: bosancz/interni-sekce-worker
      registry: ghcr.io
      tag: next
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Clean up
    needs:
      - build-app
      - build-worker
    uses: ./.github/workflows/cleanup.yml

  deploy:
    name: Deploy
    needs:
      - build-app
      - build-worker
    uses: ./.github/workflows/deploy.yml
    with:
      images: ${{ needs.build-app.outputs.images }},${{ needs.build-worker.outputs.images }}
    secrets: inherit

  tag:
    name: Tag release
    needs:
      - build-app
      - build-worker
    uses: ./.github/workflows/tag.yml
    with:
      tag: NEXT
