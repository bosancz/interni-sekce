name: Release to PRODUCTION

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Version bump"
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # TODO:
  # test:
  #   name: Test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Tests not implemented yet
  #       run: echo "No tests implemented yet"

  version:
    name: Resolve version
    uses: ./.github/workflows/version.yml
    with:
      semver: ${{ github.event.inputs.semver }}

  build-app:
    name: Build APP
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      context: .
      target: app
      image-name: bosancz/interni-sekce
      registry: ghcr.io
      tag: latest
      version: ${{ needs.version.outputs.new_tag }}
      # the changelog section is written into the tree the image is built from and pushed to master
      # once the image is published; the resulting commit is what gets tagged
      changelog-version: ${{ needs.version.outputs.new_tag }}
      changelog-branch: master
      build-args: |
        VERSION=${{ needs.version.outputs.new_tag }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Clean up APP
    needs: build-app
    uses: ./.github/workflows/cleanup.yml
    with:
      package: interni-sekce

  build-worker:
    name: Build WORKER
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      context: .
      target: worker
      image-name: bosancz/interni-sekce-worker
      registry: ghcr.io
      tag: latest
      version: ${{ needs.version.outputs.new_tag }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  cleanup-worker:
    name: Clean up WORKER
    needs: build-worker
    uses: ./.github/workflows/cleanup.yml
    with:
      package: interni-sekce-worker

  deploy:
    name: Deploy
    needs:
      - build-app
      - build-worker
    uses: ./.github/workflows/deploy.yml
    with:
      images: ${{ needs.build-app.outputs.images }},${{ needs.build-worker.outputs.images }}
    secrets: inherit

  tag:
    name: Tag release
    needs:
      - version
      - build-app
      - build-worker
    uses: ./.github/workflows/tag.yml
    with:
      tag: PRODUCTION
      version: ${{ needs.version.outputs.new_tag }}
      ref: ${{ needs.build-app.outputs.sha }}
