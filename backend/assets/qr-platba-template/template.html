<!DOCTYPE html>
<html lang="cs">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Členský příspěvek {{year}} – QR platba</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			@font-face {
				font-family: "SanGrotesk";
				src: url("{{{fontUrl}}}") format("opentype");
			}

			:root {
				--blue: #2a3478;
				--yellow: #e28f26;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
			}

			body {
				display: flex;
				justify-content: center;
				min-height: 100vh;
				padding: 28px 20px 40px;
				background: var(--blue);
				color: #fff;
				font-family: "Nunito Sans", Arial, sans-serif;
				line-height: 1.45;
			}

			main {
				display: flex;
				flex-direction: column;
				align-items: center;
				width: 100%;
				max-width: 420px;
				text-align: center;
			}

			.logo {
				display: block;
				height: 46px;
				width: auto;
				margin-bottom: 28px;
			}

			h1 {
				margin: 0;
				color: var(--yellow);
				font-family: "SanGrotesk", "Nunito Sans", sans-serif;
				font-size: 42px;
				font-weight: 400;
				line-height: 1.05;
			}

			.perex {
				margin: 14px 0 22px;
				color: var(--yellow);
				font-size: 17px;
				font-weight: 600;
			}

			.qr {
				width: 100%;
				max-width: 300px;
				padding: 18px;
				border-radius: 28px;
				background: #fff;
			}

			.qr svg {
				display: block;
				width: 100%;
				height: auto;
			}

			dl {
				width: 100%;
				margin: 26px 0 0;
				text-align: left;
			}

			dl div {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				padding: 11px 0;
				border-bottom: 2px solid rgba(226, 143, 38, 0.35);
			}

			dt {
				color: var(--yellow);
				font-weight: 600;
			}

			dd {
				margin: 0;
				font-weight: 700;
				text-align: right;
				font-variant-numeric: tabular-nums;
				user-select: all;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 10px;
				margin-top: 26px;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 12px 24px;
				border: 2px solid var(--yellow);
				border-radius: 999px;
				background: var(--yellow);
				color: var(--blue);
				font: 800 16px "Nunito Sans", Arial, sans-serif;
				text-decoration: none;
				cursor: pointer;
			}

			.btn svg {
				width: 18px;
				height: 18px;
			}

			.share {
				display: none;
			}

			.share.available {
				display: inline-flex;
			}

			.share:disabled {
				opacity: 0.6;
				cursor: default;
			}

			.share.available + .download {
				background: transparent;
				color: var(--yellow);
			}

			.follow {
				width: 100%;
				margin-top: 44px;
			}

			.follow h2 {
				margin: 0 0 16px;
				color: var(--yellow);
				font-size: 18px;
				font-weight: 800;
			}

			.circles {
				display: flex;
				justify-content: center;
				gap: 22px;
			}

			.circles a {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				color: #fff;
				font-size: 14px;
				font-weight: 700;
				text-decoration: none;
			}

			.circles span {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 64px;
				height: 64px;
				border-radius: 50%;
				background: var(--yellow);
				color: var(--blue);
			}

			.circles span svg {
				width: 30px;
				height: 30px;
			}

			.circles span .ill {
				width: 42px;
				height: 42px;
				fill: var(--blue);
			}

			@media print {
				body {
					background: #fff;
					color: var(--blue);
				}

				.actions,
				.follow {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<svg class="logo" viewBox="23.6 76.8 283.5 103" role="img" aria-label="Šán">
				<image href="{{{logoUrl}}}" x="0" y="0" width="336" height="280" />
			</svg>

			<h1>Členský příspěvek {{year}}</h1>
			<p class="perex">Naskenujte QR kód v bankovní aplikaci</p>

			<div class="qr">{{{qrSvg}}}</div>

			<dl>
				<div>
					<dt>Částka</dt>
					<dd>{{amount}}</dd>
				</div>
				<div>
					<dt>Účet</dt>
					<dd>{{account}}</dd>
				</div>
				<div>
					<dt>Variabilní symbol</dt>
					<dd>{{variableSymbol}}</dd>
				</div>
				<div>
					<dt>Zpráva pro příjemce</dt>
					<dd>{{message}}</dd>
				</div>
			</dl>

			<div class="actions">
				<button
					type="button"
					class="btn share"
					id="share"
					data-title="Členský příspěvek {{year}}"
					data-text="Členský příspěvek {{year}}&#10;Účet: {{account}}&#10;Variabilní symbol: {{variableSymbol}}&#10;Částka: {{amount}}"
				>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="18" cy="5" r="3" />
						<circle cx="6" cy="12" r="3" />
						<circle cx="18" cy="19" r="3" />
						<path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4" />
					</svg>
					Zaplatit v bance
				</button>
				<a class="btn download" href="{{pngUrl}}" download="{{pngFileName}}">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M12 3v12" />
						<path d="m7 10 5 5 5-5" />
						<path d="M5 21h14" />
					</svg>
					Stáhnout QR kód
				</a>
			</div>

			<section class="follow">
				<h2>Sledujte nás</h2>
				<div class="circles">
					<a href="{{links.program}}" target="_blank" rel="noopener">
						<span>

							<path d="M163.15,193.93c-2.69-.09-6.32-.29-9.95-.32-2.04-.01-3.77-.93-5.58-1.65-1.3-.52-2.55-1.18-3.85-1.73-1.71-.72-2.01-1.23-1.48-3.04,1.46-5.03,2.9-10.07,4.43-15.08,3.24-10.61,6.52-21.21,9.78-31.81.32-1.05.57-2.12.85-3.18.21-.82.25-1.7,1.14-2.16.22-.11.29-.57.43-.87.52-1.07.94-1.34,2.04-.98,1.19.39,2.33.96,3.5,1.4.54.2,1.16.46,1.68.35.74-.15,1.03.21,1.26.75.54,1.26,1.11,2.52,1.53,3.83,2.08,6.38,4.17,12.75,6.15,19.17,2.6,8.42,5.09,16.87,7.62,25.31.23.77.47,1.56.62,2.35.34,1.79-.06,3.23-1.27,4.71-1.75,2.14-3.94,2.85-6.39,2.91-3.86.09-7.72.03-12.51.03ZM151.36,187.63c.59.05,1.03.11,1.47.12,5.22.13,10.43.27,15.65.36,1.18.02,2.36-.06,3.53-.19,2.51-.26,2.58-.35,1.83-2.86-3.43-11.4-6.89-22.78-10.34-34.17-.1-.34-.29-.65-.44-.97-.1,0-.2,0-.29-.01-3.63,12.58-8.01,24.91-11.41,37.72Z"/>
							</svg>
						</span>
						Program
					</a>
					<a href="{{links.instagram}}" target="_blank" rel="noopener">
						<span>
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
								<rect x="3" y="3" width="18" height="18" rx="5" />
								<circle cx="12" cy="12" r="4" />
								<circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" />
							</svg>
						</span>
						Instagram
					</a>
					<a href="{{links.facebook}}" target="_blank" rel="noopener">
						<span>
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

							</svg>
						</span>
						Facebook
					</a>
				</div>
			</section>
		</main>

		<script>
			(function () {
				var button = document.getElementById("share");
				var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
				if (!button || !mobile || typeof navigator.share !== "function") return;

				button.classList.add("available");

				var download = document.querySelector(".download");
				var pngUrl = download.href;
				var fileName = download.getAttribute("download");
				var files = fetch(pngUrl)
					.then(function (response) {
						return response.ok ? response.blob() : null;
					})
					.then(function (blob) {
						return blob ? [new File([blob], fileName, { type: blob.type || "image/png" })] : null;
					})
					.catch(function () {
						return null;
					});

				button.addEventListener("click", function () {
					button.disabled = true;
					var title = button.dataset.title;
					var text = button.dataset.text;

					files
						.then(function (list) {
							if (list && navigator.canShare && navigator.canShare({ files: list })) {
								return navigator.share({ files: list, title: title, text: text });
							}
							return navigator.share({ title: title, text: text, url: location.href });
						})
						.catch(function () {})
						.then(function () {
							button.disabled = false;
						});
				});
			})();
		</script>
	</body>
</html>
