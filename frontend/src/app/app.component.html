<ion-app>
	@if (user()) {
		<div class="layout">
			<bo-header />

			<div class="page">
				@if (isLg()) {
					<div class="sidebar">
						<bo-sidebar></bo-sidebar>
					</div>
				}

				<main>
					<ion-router-outlet id="content"></ion-router-outlet>
				</main>
			</div>
		</div>
	} @else if (user() === null) {
		<bo-login></bo-login>
	} @else {
		<bo-app-loading></bo-app-loading>
	}
</ion-app>
