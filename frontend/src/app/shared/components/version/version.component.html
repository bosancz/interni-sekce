<p class="version">
	@switch (updateStatus()) {
		@case ("checking") {
			<ion-spinner></ion-spinner>
		}
		@case ("available") {
			<a (click)="doUpdate()" class="clickable">Aktualizovat</a>
		}
		@default {
			<a (click)="openChangelog()" class="clickable">
				<ion-icon name="time-outline"></ion-icon>
				Verze {{ version() }}
			</a>
		}
	}
</p>
