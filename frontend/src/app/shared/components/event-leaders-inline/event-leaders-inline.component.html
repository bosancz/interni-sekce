@for (leader of leaders(); track leader.id; let isLast = $last) {
	<span class="leader"
		><span class="leader-avatar" [style.background-color]="leader.groupId | group: 'color'">
			@if (leader | memberProfilePhotoUrl; as photoUrl) {
				<img [src]="photoUrl" alt="" />
			} @else {
				@let initial = (leader | member: "nickname")?.charAt(0);
				<span class="bo-initial" [class.bo-initial-accent]="initial | accentAbove">{{ initial }}</span>
			}</span
		>{{ leader | member: "nickname" }}{{ isLast ? "" : "," }}</span
	>
} @empty {
	<span class="bo-pill bo-pill-danger-dashed">Bez vedoucího</span>
}
