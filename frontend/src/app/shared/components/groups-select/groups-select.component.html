<div class="group-badges">
	@for (group of groups(); track group.id; let isLast = $last) {
		<span
			(click)="toggleGroup(group.id)"
			[class.active]="isSelected(group.id)"
			[style.background-color]="group.color || '#999'"
			class="group-badge me-2 my-2"
		>
			{{ group.shortName }}
		</span>
	}
</div>

@if (multiple() && !readonly() && childrenGroups().length > 1) {
	<ion-checkbox
		class="select-all"
		labelPlacement="end"
		[disabled]="disabled()"
		[checked]="isSelectedAll()"
		(ionChange)="selectAll($any($event).detail.checked)"
	>
		Všechny oddíly
	</ion-checkbox>
}
