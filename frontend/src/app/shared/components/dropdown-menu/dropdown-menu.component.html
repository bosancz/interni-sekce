<ion-popover
	cssClass="bo-dropdown-popover"
	alignment="end"
	[isOpen]="isOpen()"
	[event]="triggerEvent()"
	(didDismiss)="isOpen.set(false)"
>
	<ng-template>
		<ion-content>
			<div class="bo-dropdown-panel" role="menu">
				@if (header()) {
					<div class="bo-dropdown-header">{{ header() }}</div>
				}
				@for (option of options(); track option.value) {
					@if (option.divider) {
						<div class="bo-dropdown-divider" role="separator"></div>
					}
					<button
						type="button"
						class="bo-dropdown-option"
						[attr.role]="value() === undefined ? 'menuitem' : 'menuitemradio'"
						[class.selected]="option.value === value()"
						[class.bold]="option.bold"
						[class.danger]="option.danger"
						[attr.aria-checked]="value() === undefined ? null : option.value === value()"
						(click)="choose(option)"
					>
						@if (option.icon) {
							<ion-icon class="bo-dropdown-icon" [name]="option.icon" aria-hidden="true"></ion-icon>
						}
						<span class="bo-dropdown-label">
							<span>
								@if (option.prefix) {
									<strong>{{ option.prefix }}</strong> ·
								}
								{{ option.label }}</span
							>
							@if (option.description) {
								<small>{{ option.description }}</small>
							}
						</span>
						@if (option.value === value()) {
							<ion-icon name="checkmark" aria-hidden="true"></ion-icon>
						}
					</button>
				}
			</div>
		</ion-content>
	</ng-template>
</ion-popover>
