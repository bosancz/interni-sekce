<ion-popover
	cssClass="bo-dropdown-popover"
	alignment="end"
	[isOpen]="isOpen()"
	[event]="triggerEvent()"
	(didDismiss)="isOpen.set(false)"
>
	<ng-template>
		<ion-content>
			<div class="bo-dropdown-panel" role="menu">
				@if (header()) {
					<div class="bo-dropdown-header">{{ header() }}</div>
				}
				@for (option of options(); track option.value) {
					<button
						type="button"
						role="menuitemradio"
						class="bo-dropdown-option"
						[class.selected]="option.value === value()"
						[class.bold]="option.bold"
						[attr.aria-checked]="option.value === value()"
						(click)="choose(option)"
					>
						<span class="bo-dropdown-label">
							<span>{{ option.label }}</span>
							@if (option.description) {
								<small>{{ option.description }}</small>
							}
						</span>
						@if (option.value === value()) {
							<ion-icon name="checkmark" aria-hidden="true"></ion-icon>
						}
					</button>
				}
			</div>
		</ion-content>
	</ng-template>
</ion-popover>
