<bo-modal-layout>
	<h4 slot="title">{{ header }}</h4>

	<div class="bm-body" [class.bd-large]="large">
		@if (message) {
			<p class="bd-message" [innerHTML]="message"></p>
		}

		@for (input of inputs; track input.name; let first = $first) {
			@if (input.type === "date-range") {
				<div class="bd-field" role="group" [attr.aria-label]="input.label ?? null">
					@if (input.label) {
						<span class="bd-label">{{ input.label }}</span>
					}
					<div class="bd-range">
						<label class="bd-field">
							<span class="bd-sublabel">Od</span>
							<input
								class="bd-input"
								type="date"
								[value]="values()[input.name][0]"
								[attr.autofocus]="first ? '' : null"
								(input)="setRange(input.name, 0, $any($event.target).value)"
								(keydown.enter)="onEnter($event, input)"
							/>
						</label>
						<label class="bd-field">
							<span class="bd-sublabel">Do</span>
							<input
								class="bd-input"
								type="date"
								[value]="values()[input.name][1]"
								[min]="values()[input.name][0] || null"
								(input)="setRange(input.name, 1, $any($event.target).value)"
								(keydown.enter)="onEnter($event, input)"
							/>
						</label>
					</div>
				</div>
			} @else {
				<label class="bd-field">
					@if (labelOf(input); as label) {
						<span class="bd-label">{{ label }}</span>
					}
					@if (input.type === "textarea") {
						<textarea
							class="bd-input bd-textarea"
							[placeholder]="input.placeholder ?? ''"
							[value]="values()[input.name]"
							[attr.autocapitalize]="input.autocapitalize ?? null"
							[attr.autofocus]="first ? '' : null"
							(input)="setValue(input.name, $any($event.target).value)"
						></textarea>
					} @else {
						<input
							class="bd-input"
							[type]="input.type ?? 'text'"
							[placeholder]="input.placeholder ?? ''"
							[attr.aria-label]="labelOf(input) ? null : input.placeholder"
							[value]="values()[input.name]"
							[attr.autocapitalize]="input.autocapitalize ?? null"
							[attr.autofocus]="first ? '' : null"
							(input)="setValue(input.name, $any($event.target).value)"
							(keydown.enter)="onEnter($event, input)"
						/>
					}
				</label>
			}
		}

		@if (options.length) {
			<div class="bd-options" [attr.role]="multiple ? 'group' : 'radiogroup'">
				@for (option of options; track option.value) {
					<button
						type="button"
						class="bm-check-row bd-option"
						[class.checked]="isChosen(option)"
						[attr.role]="multiple ? 'checkbox' : 'radio'"
						[attr.aria-checked]="isChosen(option)"
						(click)="choose(option)"
					>
						@if (multiple) {
							<span class="bm-checkbox">
								@if (isChosen(option)) {
									<ion-icon name="checkmark-outline"></ion-icon>
								}
							</span>
						} @else {
							<span class="bd-radio"></span>
						}
						@if (option.color) {
							<span class="bd-swatch" [style.background]="option.color"></span>
						}
						<span class="bm-row-label">{{ option.label }}</span>
					</button>
				}
			</div>
		}
	</div>

	<div slot="buttons" class="bm-buttons">
		@if (cancelText) {
			<button type="button" class="bm-btn-ghost" (click)="close.emit()">{{ cancelText }}</button>
		}
		<button
			type="button"
			class="bm-btn-primary"
			[class.bd-destructive]="destructive"
			[disabled]="!valid()"
			(click)="confirm()"
		>
			{{ confirmText }}
		</button>
	</div>
</bo-modal-layout>
