<bo-modal-layout>
	<div slot="title" class="changelog-header">
		<h1>Seznam změn</h1>

		<a
			class="github-link"
			[href]="repositoryUrl"
			target="_blank"
			rel="noopener"
			aria-label="Zobrazit repozitář na GitHubu"
		>
			<ion-icon name="logo-github"></ion-icon>
		</a>
	</div>

	@if (content() === undefined) {
		<p class="muted">Načítání…</p>
	} @else if (content()) {
		@if (types().length > 1) {
			<div class="changelog-filter">
				<button type="button" class="changelog-pill" [class.active]="!selectedTypes().size" (click)="showAll()">
					Vše
				</button>
				@for (type of types(); track type.type) {
					<button
						type="button"
						class="changelog-pill"
						[class.active]="selectedTypes().has(type.type)"
						[class.shown]="isShown(type.type)"
						[attr.aria-pressed]="selectedTypes().has(type.type)"
						[title]="type.type"
						(click)="toggleType(type.type)"
					>
						<span class="emoji">{{ type.emoji }}</span>
						{{ type.label }}
						<span class="count">{{ type.count }}</span>
					</button>
				}
			</div>
		}

		@if (filteredContent()) {
			<div class="changelog" [innerHTML]="filteredContent() | markdown | changelogLinks"></div>
		} @else {
			<p class="muted">Vybraným typům neodpovídají žádné změny.</p>
		}
	} @else {
		<p class="muted">Zatím tu nejsou žádné změny k zobrazení.</p>
	}

	<ion-buttons slot="buttons">
		<ion-button (click)="close.emit()" color="primary">Zavřít</ion-button>
	</ion-buttons>
</bo-modal-layout>
