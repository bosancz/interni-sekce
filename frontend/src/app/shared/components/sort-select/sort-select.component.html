<ion-list lines="full">
	<ion-item-divider>{{ label() }}</ion-item-divider>

	<ion-item lines="none">
		<ion-select
			label="Seřadit podle"
			interface="popover"
			justify="start"
			placeholder="Výchozí"
			[ngModel]="sort()"
			(ngModelChange)="selectColumn($event)"
		>
			<ion-select-option [value]="null">Výchozí</ion-select-option>
			@for (option of options(); track option.key) {
				<ion-select-option [value]="option.key">{{ option.label }}</ion-select-option>
			}
		</ion-select>

		@if (sort()) {
			<ion-button
				slot="end"
				fill="clear"
				size="small"
				color="medium"
				[attr.aria-label]="order() === 'ASC' ? 'Vzestupně' : 'Sestupně'"
				(click)="toggleOrder()"
			>
				<ion-icon slot="icon-only" [name]="order() === 'ASC' ? 'arrow-up' : 'arrow-down'"></ion-icon>
			</ion-button>
		}
	</ion-item>
</ion-list>
