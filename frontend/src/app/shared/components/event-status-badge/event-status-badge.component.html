<ion-badge
	[style.background-color]="event().status | eventStatus: 'background'"
	[style.color]="event().status | eventStatus: 'foreground'"
>
	{{ event().status | eventStatus: "name" }}
	@if (event().statusNote) {
		<span
			class="note-icon"
			tabindex="0"
			role="img"
			aria-label="Poznámka ke stavu"
			data-no-hover-preview
			[boTooltip]="event().statusNote"
			[boTooltipTap]="true"
		>
			<ion-icon name="chatbubble-ellipses-outline"></ion-icon>
		</span>
	}
</ion-badge>
