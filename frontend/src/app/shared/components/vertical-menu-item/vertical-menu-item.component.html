<ion-item [button]="true" [class.active]="isActive()" (click)="onClick()">
	@if (icon()) {
		<ion-icon [name]="icon()!" class="me-3"></ion-icon>
	}
	<ion-label>{{ label() }}</ion-label>
	@if (badge() !== undefined) {
		<ion-badge slot="end" [class.badge-attention]="badgeVariant() === 'attention'">{{ badge() }}</ion-badge>
	}
</ion-item>
