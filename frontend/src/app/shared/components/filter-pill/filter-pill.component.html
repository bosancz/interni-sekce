<button type="button" class="filter-pill-button" [class.has-value]="selected().length > 0" (click)="open($event)">
	<span>{{ buttonLabel() }}</span>
	<ion-icon name="chevron-down" aria-hidden="true"></ion-icon>
</button>

<ion-popover
	cssClass="filter-pill-chips-popover"
	[dismissOnSelect]="false"
	[isOpen]="popoverOpen()"
	[event]="popoverEvent()"
	(didDismiss)="popoverOpen.set(false)"
>
	<ng-template>
		<ion-content>
			<div class="filter-pill-panel">
				<div
					class="filter-pill-chips"
					[class.single-column]="columns() === 1"
					[style.--pill-columns]="columns()"
				>
					@for (option of options(); track option.value) {
						<button
							type="button"
							class="filter-pill-chip"
							[class.selected]="isSelected(option.value)"
							[class.colored]="!!option.background || !!option.color"
							[class.single-color]="!!option.color && !option.background"
							[style.--chip-bg]="option.background || null"
							[style.--chip-fg]="option.foreground || null"
							[style.--chip-color]="option.color || null"
							(click)="toggle(option.value)"
						>
							{{ option.label }}
						</button>
					}
				</div>
				@if (selected().length) {
					<button type="button" class="filter-pill-clear" (click)="clear()">Zrušit výběr</button>
				}
			</div>
		</ion-content>
	</ng-template>
</ion-popover>
