<ion-tab-button (click)="openTab()" [class.tab-selected]="active()">
	@if (icon()) {
		<ion-icon [name]="icon()"></ion-icon>
	}
	<ion-label>{{ label() }}</ion-label>
	@if (badge() !== undefined) {
		<ion-badge [class.badge-attention]="badgeVariant() === 'attention'">{{ badge() }}</ion-badge>
	}
</ion-tab-button>
