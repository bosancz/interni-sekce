@if (!showSearch()) {
	<div class="brand">
		<a routerLink="/" class="logo"><img src="assets/img/logo.svg" alt="Logo" /></a>
		<h1>
			Bošán
			@if (environment()) {
				<span class="environment">{{ environment() }}</span>
			}
		</h1>
	</div>

	@if (showHistoryNav()) {
		<ion-buttons class="history-nav">
			<ion-button fill="clear" title="Zpět" aria-label="Zpět" [disabled]="!canGoBack()" (click)="goBack()">
				<ion-icon slot="icon-only" name="arrow-back-sharp"></ion-icon>
			</ion-button>
			<ion-button
				fill="clear"
				title="Vpřed"
				aria-label="Vpřed"
				[disabled]="!canGoForward()"
				(click)="goForward()"
			>
				<ion-icon slot="icon-only" name="arrow-forward-sharp"></ion-icon>
			</ion-button>
		</ion-buttons>
	}
}

@if (isLg() || showSearch()) {
	<div class="search-area">
		<bo-global-search [showCancelButton]="!isLg()" (close)="showSearch.set(false)" (searchBlur)="onSearchBlur()" />
	</div>
}

@if (isLg()) {
	<div class="end-spacer"></div>
} @else {
	<ion-buttons slot="end">
		@if (!showSearch()) {
			<ion-button fill="clear" size="large" (click)="showSearch.set(true)">
				<ion-icon name="search-sharp"></ion-icon>
			</ion-button>
		}

		<bo-account-menu />
	</ion-buttons>
}
