<ion-list lines="none" mode="md">
	<ion-item routerLink="/" [queryParams]="{ tab: 'dashboard' }">
		<ion-icon name="home-sharp" class="me-3"></ion-icon>
		<ion-label>Bošán</ion-label>
	</ion-item>
	<div class="ms-4">
		<ion-item routerLink="akce">Akce</ion-item>
		<ion-item routerLink="galerie">Galerie</ion-item>
		<ion-item routerLink="databaze">Databáze</ion-item>
		<ion-item routerLink="program">Program</ion-item>
	</div>
	<ion-item routerLink="/" [queryParams]="{ tab: 'calendar' }">
		<ion-icon name="calendar-sharp" class="me-3"></ion-icon>
		<ion-label>Kalendář</ion-label>
	</ion-item>
	<ion-item routerLink="/" [queryParams]="{ tab: 'my' }">
		<ion-icon name="heart-sharp" class="me-3"></ion-icon>
		<ion-label>Moje</ion-label>
	</ion-item>
</ion-list>
<hr />
<ion-list lines="none" mode="md">
	<ion-item routerLink="/ucet">
		<ion-icon class="me-3" name="person"></ion-icon>
		<ion-label>Můj účet</ion-label>
	</ion-item>

	<ion-item routerLink="/admin">
		<ion-icon class="me-3" name="settings"></ion-icon>
		<ion-label>Administrace</ion-label>
	</ion-item>

	<ion-item [button]="true" (click)="logout()">
		<ion-icon class="me-3" name="log-out"></ion-icon>
		<ion-label>Odhlásit se</ion-label>
	</ion-item>
</ion-list>

<div class="bottom">
	<bo-dark-mode-toggle></bo-dark-mode-toggle>
	<bo-version class="mt-2"></bo-version>
</div>
