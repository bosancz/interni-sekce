<ion-list lines="none" mode="md">
	<ion-item routerLink="/ucet">
		<ion-icon class="me-3" name="person"></ion-icon>
		<ion-label>Můj účet</ion-label>
	</ion-item>

	@if (canAccessAdmin()) {
		<ion-item routerLink="/admin">
			<ion-icon class="me-3" name="settings"></ion-icon>
			<ion-label>Administrace</ion-label>
		</ion-item>
	}

	<ion-item [button]="true" (click)="logout(); this.close()">
		<ion-icon class="me-3" name="log-out"></ion-icon>
		<ion-label>Odhlásit se</ion-label>
	</ion-item>
</ion-list>
@if (!isLg()) {
	<bo-dark-mode-toggle class="mt-4"></bo-dark-mode-toggle>
	<bo-version class="mt-2 mb-2"></bo-version>
}
