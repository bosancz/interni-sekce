<h3>Vedoucí</h3>

@if (leaders && !leaders.length) {
	<p><em>Žádní účastníci</em></p>
}

<bo-event-attendees-list
	[event]="event"
	[attendees]="leaders"
	(remove)="removeAttendee($event)"
></bo-event-attendees-list>

<div class="text-center">
	<bo-add-button (click)="addAttendee('leader')">Přidat vedoucí</bo-add-button>
</div>

<h3>Účastníci</h3>

@if (attendees && !attendees.length) {
	<p><em>Žádní účastníci</em></p>
}

<bo-event-attendees-list
	[event]="event"
	[attendees]="attendees"
	(remove)="removeAttendee($event)"
></bo-event-attendees-list>

@if (event?._links?.addEventAttendee?.allowed) {
	<div class="text-center">
		<bo-add-button (click)="addAttendee('attendee')">Přidat účastníka</bo-add-button>
	</div>
}

@if (event && event._links.getEventAnnouncement.allowed) {
	<div class="text-center">
		<ion-button (click)="getAnnouncement(event)" expand="block" fill="outline"> Stáhnout ohlášku </ion-button>
	</div>
}
