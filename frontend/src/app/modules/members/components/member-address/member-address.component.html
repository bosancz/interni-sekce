<h3 class="mt-4">Adresa</h3>
<bo-card class="address">
	<bo-card-content>
		@if (member === undefined) {
			<ion-skeleton-text [animated]="true"></ion-skeleton-text>
		}

		@if (member) {
			<ion-list class="selectable" lines="none">
				<ion-item [button]="true" [detail]="false">
					@if (getFullAddress(member)) {
						<ion-label>{{ getFullAddress(member) }}</ion-label>
					} @else {
						<ion-label><em>Adresa není vyplněna</em></ion-label>
					}

					<ion-buttons slot="end">
						<bo-copy-button [text]="getFullAddress(member)"></bo-copy-button>
						<bo-edit-button (click)="editAddress()"></bo-edit-button>
					</ion-buttons>
				</ion-item>
			</ion-list>
		}
	</bo-card-content>
</bo-card>
