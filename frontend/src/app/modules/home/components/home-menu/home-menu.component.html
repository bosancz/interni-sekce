<div class="row no-gutters">
	@for (item of items; track item.link) {
		<div class="col-12 col-md-3 col-lg-2">
			<ion-card [routerLink]="item.link" class="mx-0 my-3" [color]="item.color">
				<ion-card-content>
					<h2>{{ item.title }}</h2>
				</ion-card-content>
			</ion-card>
		</div>
	}
</div>
