<bo-modal-layout>
	<h4 slot="title">Uzavření akce</h4>

	<ion-list>
		<ion-item lines="none">
			<ion-checkbox
				justify="start"
				labelPlacement="end"
				[checked]="accountingSent()"
				[disabled]="!accountingEditable()"
				(ionChange)="accountingSent.set($any($event).detail.checked)"
			>
				Vyúčtování odesláno
			</ion-checkbox>
		</ion-item>
		<ion-note class="hint">Vyúčtování se odevzdává mimo systém — po odeslání ho tady zaškrtni.</ion-note>

		<ion-item lines="none">
			<ion-checkbox justify="start" labelPlacement="end" [checked]="reportFilled()" [disabled]="true">
				Report vyplněn
			</ion-checkbox>
		</ion-item>
		<ion-note class="hint">Zaškrtne se samo, jakmile je vyplněný report akce.</ion-note>

		<ion-item lines="none">
			<ion-checkbox justify="start" labelPlacement="end" [checked]="albumPublished()" [disabled]="true">
				Galerie zveřejněna
			</ion-checkbox>
		</ion-item>
		<ion-note class="hint">{{ albumHint() }}</ion-note>
	</ion-list>

	<ion-buttons slot="buttons">
		<ion-button (click)="close.emit()" color="secondary">Zrušit</ion-button>
		<ion-button (click)="save()" color="primary" [disabled]="!accountingEditable()">Uložit</ion-button>
	</ion-buttons>
</bo-modal-layout>
