@if (attendees()?.length === 0) {
	<p class="attendees-empty text-muted"><em>Žádní účastníci</em></p>
} @else {
	<bo-people-filter
		class="attendees-filter"
		[columns]="columns"
		[sortOptions]="sortOptions"
		[sort]="sort()"
		[order]="order()"
		[autofocus]="false"
		(sortChange)="setSort($event)"
		(change)="onFilterChange($event)"
	/>

	<bo-people-table
		class="attendees-table"
		[rows]="filteredAttendees()"
		[loading]="attendees() === undefined"
		[skeletonRows]="10"
		[visible]="columns.visible()"
		[columnOrder]="columnOrder"
		[sortable]="sortableKeys"
		[member]="memberOf"
		[role]="roleOf"
		[ageAt]="event()?.dateFrom"
		[rowLink]="rowLink"
		[rowClass]="rowClass"
		[trackBy]="trackBy"
		[actions]="attendeeActions"
		[actionsHeader]="rowActionsHeader"
		[sort]="sort()"
		[order]="order()"
		(sortChange)="setSort($event)"
	>
		<ng-template boPeopleNicknameSuffix let-attendee>
			@if (attendee.type === "leader") {
				<span class="lead-tag" boTooltip="Vede akci" aria-label="Vede akci"
					><ion-icon name="flag" aria-hidden="true"></ion-icon
				></span>
			}
		</ng-template>

		<admin-table-column key="notes" header="Poznámky" [below]="true">
			<ng-container *adminCell="let attendee">
				<span class="notes">
					@for (note of notes().get(attendee.memberId) ?? []; track $index) {
						<span class="note" [class]="'note-' + note.tone">
							<ion-icon [name]="note.icon" aria-hidden="true"></ion-icon>{{ note.text }}
						</span>
					}
				</span>
			</ng-container>
		</admin-table-column>
	</bo-people-table>
}
