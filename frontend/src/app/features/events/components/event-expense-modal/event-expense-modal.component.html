<bo-modal-layout>
	<h4 slot="title">Účtenka {{ expense?.receiptNumber }}</h4>

	<form #expenseForm="ngForm">
		<ion-item>
			<ion-input
				label="ID"
				labelPlacement="floating"
				placeholder="V12"
				name="receiptNumber"
				[ngModel]="expense?.receiptNumber"
				required
			></ion-input>
		</ion-item>
		<ion-item>
			<ion-select
				label="Typ"
				labelPlacement="floating"
				placeholder="Vyber typ"
				name="type"
				[ngModel]="expense?.type"
			>
				@for (type of types | keyvalue: keepOrder; track type.key) {
					<ion-select-option [value]="type.key" required>{{ type.value.title }}</ion-select-option>
				}
			</ion-select>

			<bo-event-expense-types-info slot="end"></bo-event-expense-types-info>
		</ion-item>
		<ion-item>
			<ion-input
				label="Popis"
				labelPlacement="floating"
				placeholder="Tabák do Gandalfovy dýmky"
				name="description"
				[ngModel]="expense?.description"
				required
			></ion-input>
		</ion-item>

		<ion-item>
			<ion-input
				label="Částka"
				labelPlacement="floating"
				type="text"
				inputmode="decimal"
				placeholder="1 250,50"
				name="amount"
				#amountModel="ngModel"
				[ngModel]="formatAmount(expense?.amount)"
				[pattern]="amountPattern"
				errorText="Zadej částku, např. 1 250,50"
				required
			></ion-input>
		</ion-item>
	</form>

	<ion-buttons slot="buttons">
		<ion-button (click)="close.emit()">Zrušit</ion-button>
		<ion-button fill="clear" color="primary" [disabled]="amountModel.invalid" (click)="save(expenseForm.value)"
			>Uložit</ion-button
		>
	</ion-buttons>
</bo-modal-layout>
