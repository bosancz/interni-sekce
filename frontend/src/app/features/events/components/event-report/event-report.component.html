<h3>
	Kronika akce
	<bo-edit-button-markdown
		slot="end"
		label="Report"
		[disabled]="!event()?._links?.updateEvent?.allowed"
		[value]="event()?.report"
		(update)="update.emit({ report: $event })"
	/>
</h3>

@if (event() && event()!.report) {
	<div [innerHTML]="event()!.report | markdown"></div>
} @else if (event()) {
	<p><em>Report je prázdný.</em></p>
} @else {
	<p><ion-skeleton-text animated></ion-skeleton-text></p>
}
