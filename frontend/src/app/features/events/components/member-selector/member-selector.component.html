@for (member of value; track member.id) {
	<ion-chip (click)="$event.stopPropagation()">
		{{ member | member: "nickname" }}
		<ion-icon name="close-circle" (click)="removeMember(member); $event.stopPropagation()"></ion-icon>
	</ion-chip>
}

@if ((multiple() || multiple() === "") && value.length) {
	<ion-chip (click)="openModal(); $event.stopPropagation()" color="success">
		přidat <ion-icon name="add-circle"></ion-icon>
	</ion-chip>
}
