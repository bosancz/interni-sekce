@if (birthdays().length) {
	<ion-list lines="full">
		@for (birthday of birthdays(); track birthday.member.id) {
			<ion-item>
				<ion-label>
					<h4><strong>{{ birthday.member.nickname }}</strong></h4>
					<p>{{ birthday.date | date: "d. M." }} ({{ birthday.age }} let)</p>
				</ion-label>
			</ion-item>
		}
	</ion-list>
} @else {
	<p><em>Žádné narozeniny v době konání akce</em></p>
}
