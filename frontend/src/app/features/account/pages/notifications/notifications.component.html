<bo-page-header title="Notifikace" [actions]="actions()">
	<ion-buttons slot="start">
		<ion-back-button defaultHref="/ucet" />
	</ion-buttons>
</bo-page-header>

<bo-page-content [padding]="true">
	@if (notifications(); as notifications) {
		<div class="notifications-layout">
			<bo-card>
				<bo-card-content>
					<div class="bo-info-list">
						@for (notification of notifications; track notification.id) {
							<div
								class="bo-info-row notification-row"
								[class.unread]="!notification.readAt"
								(click)="openNotification(notification)"
							>
								<span class="notification-dot"></span>
								<span class="notification-info">
									<span class="notification-title">{{ notification.title }}</span>
									@if (notification.body) {
										<span class="notification-body">{{ notification.body }}</span>
									}
									<span class="notification-date">{{
										notification.createdAt | date: "d. M. yyyy H:mm"
									}}</span>
								</span>
							</div>
						} @empty {
							<div class="bo-info-row notifications-empty">
								<ion-icon name="notifications-off-outline" />
								<span>Zatím tu nejsou žádná upozornění.</span>
							</div>
						}
					</div>
				</bo-card-content>
			</bo-card>
		</div>
	}
</bo-page-content>
