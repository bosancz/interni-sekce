<bo-people-filter
	[columns]="columns"
	[sortOptions]="sortOptions"
	[sort]="sortColumn()"
	[order]="sortOrder()"
	[showInactive]="showInactive()"
	(sortChange)="onSortChange($event)"
	(showInactiveChange)="setShowInactive($event)"
	(change)="onFilterChange($event)"
>
	<ng-template boPeopleFilterPills>
		<bo-filter-pill
			label="Role"
			[options]="roleOptions"
			[selected]="selectedRoles()"
			(selectedChange)="setRolesFilter($event)"
		/>
		<bo-filter-pill
			label="Členství"
			[options]="membershipOptions"
			[selected]="selectedMembership()"
			(selectedChange)="setMembershipFilter($event)"
		/>
		<bo-filter-pill
			label="Ocenění"
			[options]="achievementOptions"
			[selected]="selectedAchievements()"
			(selectedChange)="setAchievementsFilter($event)"
		/>
	</ng-template>

	<span people-filter-actions>
		@if (members()?.length) {
			<ion-button
				class="members-mail-button"
				fill="clear"
				size="small"
				color="primary"
				[href]="mailto()"
				[boTooltip]="mailTooltip()"
				(click)="sendMail()"
				aria-label="Napsat e-mail všem v oddíle"
			>
				<ion-icon name="mail-outline" slot="start"></ion-icon>
				<span class="mail-label">Napsat všem</span>
			</ion-button>
		}
	</span>
</bo-people-filter>

<bo-people-table
	[rows]="members()"
	[loading]="members() === undefined"
	[visible]="columns.visible()"
	rightColumn="status"
	[rowLink]="rowLink"
	[rowClass]="rowClass"
	[actions]="memberActions"
	[actionsHeader]="rowActionsHeader"
	[sort]="sortColumn()"
	[order]="sortOrder()"
	(sortChange)="onSortChange($event)"
/>
