<bo-page-header title="Kalendář" [actions]="actions()" />

<div class="weekdays" aria-hidden="true">
	@for (day of weekdays; track day; let i = $index) {
		<span [class.weekend]="i >= 5">{{ day }}</span>
	}
</div>

<bo-page-content>
	<ion-infinite-scroll position="top" [disabled]="!scrollReady()" (ionInfinite)="loadMorePrevious($event)">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>

	<bo-event-calendar
		[dateFrom]="dateFrom()"
		[dateTill]="dateTill()"
		[events]="events()"
		[cpv]="true"
		[headingLevel]="3"
		[monthLabels]="true"
		[selection]="addEventEnabled()"
		(select)="createEvent($event)"
	></bo-event-calendar>

	<ion-infinite-scroll [disabled]="!scrollReady()" (ionInfinite)="loadMoreFuture($event)">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</bo-page-content>

<div class="month-bar">
	<button type="button" class="month-nav-button" aria-label="Předchozí měsíc" (click)="previousMonth()">
		<ion-icon name="chevron-back-outline"></ion-icon>
	</button>
	<button type="button" class="month-title" aria-label="Přejít na měsíc" (click)="openMonthPicker()">
		<span>{{ visibleMonthLabel() }}</span>
	</button>
	<button type="button" class="month-nav-button" aria-label="Další měsíc" (click)="nextMonth()">
		<ion-icon name="chevron-forward-outline"></ion-icon>
	</button>
	<button type="button" class="today-button" [class.away]="!isCurrentMonth()" (click)="goToToday()">Dnes</button>
</div>
