<bo-page-content [padding]="true">
	<div class="p-1 p-lg-3">
		<div class="row no-gutters">
			<div class="col-lg-6 col-xl-8 pr-lg-2">
				<div class="row nav-buttons">
					<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
						<bo-button-square
							routerLink="/akce"
							[queryParams]="{ year: 'budouci' }"
							label="Akce"
							color="var(--san-blue)"
							tint="var(--bo-blue-tint)"
							image="assets/img/button-akce.svg"
						/>
					</div>
					<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
						<a
							href="https://wiki.bosan.cz"
							target="_blank"
							rel="noopener"
							class="d-block text-decoration-none"
						>
							<bo-button-square
								label="Wiki"
								color="var(--san-green)"
								tint="var(--bo-green-tint)"
								image="assets/img/button-wiki.svg"
							/>
						</a>
					</div>
					<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
						<bo-button-square
							routerLink="/galerie"
							label="Galerie"
							color="var(--san-yellow)"
							tint="var(--bo-yellow-tint)"
							image="assets/img/button-galerie.svg"
						/>
					</div>
					<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
						<bo-button-square
							routerLink="/databaze"
							label="Databáze"
							color="var(--san-red)"
							tint="var(--bo-red-tint)"
							image="assets/img/button-databaze.svg"
						/>
					</div>
				</div>

				<div class="row pl-lg-2">
					<div class="col-12 col-lg-6">
						<bo-home-card-my-events class="mb-3 mb-lg-3"></bo-home-card-my-events>
					</div>
					<div class="col-12 col-lg-6">
						<bo-home-card-noleader-events class="mb-3 mb-lg-3"></bo-home-card-noleader-events>
					</div>
				</div>
			</div>
			<div class="col-lg-6 col-xl-4 pl-lg-2">
				<bo-event-calendar
					[dateFrom]="dateFrom()"
					[dateTill]="dateTill()"
					[events]="events()"
					[cpv]="true"
					[headingLevel]="3"
				></bo-event-calendar>
			</div>
		</div>
	</div>
</bo-page-content>
