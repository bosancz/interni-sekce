<bo-page-header
	[title]="album()?.name"
	backUrl="/galerie"
	[actions]="headerActions()"
	actionsHeader="Album"
/>

@if (selecting()) {
	<div class="selection-bar d-lg-none">
		<ion-button (click)="deleteSelected()" [disabled]="!selectedPhotos().length" fill="clear" color="danger">
			<ion-icon slot="start" name="trash-outline"></ion-icon> Smazat ({{ selectedPhotos().length }})
		</ion-button>

		<ion-button (click)="cancelSelecting()" fill="clear">
			<ion-icon slot="start" name="close-outline"></ion-icon> Zrušit
		</ion-button>
	</div>
}

<bo-page-content [padding]="true">
	<bo-album-info [album]="album()" (update)="updateAlbum($event)" />

	<h2>Galerie</h2>

	<bo-album-gallery
		[photos]="photos()"
		[view]="photosView()"
		[selecting]="selecting()"
		[selectedPhotos]="selectedPhotos()"
		(upload)="uploadPhotos()"
		(viewChange)="photosView.set($event)"
		(sortDate)="sortByDate()"
		(sortName)="sortByName()"
		(selectingStart)="startSelecting()"
		(selectingCancel)="cancelSelecting()"
		(deleteSelected)="deleteSelected()"
		(selectedPhotosChange)="selectedPhotos.set($event)"
		(reorder)="onReorder($event)"
		(photoClick)="onGalleryClick($event)"
		(listClick)="onListClick($event)"
		(longPress)="onLongPress($event)"
	/>
</bo-page-content>
