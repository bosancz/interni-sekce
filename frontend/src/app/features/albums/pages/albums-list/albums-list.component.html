<bo-page-header title="Galerie" backUrl="/" [actions]="actions()" />

<bo-page-content>
	<bo-filter [search]="true" [showButtonMobileOnly]="true" [immediateFilter]="true">
		@if (isDesktop()) {
			<!-- Desktop: filter pills laid out inline in the toolbar. -->
			<div toolbar-actions slot="end" class="albums-filter-actions">
				<ng-container [ngTemplateOutlet]="filterPills"></ng-container>
			</div>
		} @else {
			<!-- Mobile: the same filter pills collected inside the filter modal, plus a sort control
			     (the sortable table headers aren't available in the mobile grid view). -->
			<div class="albums-filter-modal">
				<div class="albums-filter-modal-pills">
					<ng-container [ngTemplateOutlet]="filterPills"></ng-container>
				</div>

				<bo-sort-select
					[options]="sortOptions"
					[sort]="sortColumn()"
					[order]="sortOrder()"
					(sortChange)="onSortChange($event)"
				/>
			</div>
		}
	</bo-filter>

	<!-- Filter pills, shared between the desktop toolbar and the mobile filter modal. -->
	<ng-template #filterPills>
		<bo-filter-pill
			label="Rok"
			[columns]="3"
			[options]="yearOptions()"
			[selected]="selectedYears()"
			(selectedChange)="setFilterParam('year', $event)"
		/>

		<bo-filter-pill
			label="Stav"
			[options]="statusOptions()"
			[selected]="selectedStatuses()"
			(selectedChange)="setFilterParam('status', $event)"
		/>
	</ng-template>

	<admin-table
		[class]="'albums-table'"
		[display]="view() === 'table' ? 'table' : 'list'"
		[rows]="albums()"
		[loading]="albums() === undefined"
		[rowLink]="rowLink"
		[actions]="albumActions"
		[actionsHeader]="rowActionsHeader"
		[sort]="sortColumn()"
		[order]="sortOrder()"
		(sortChange)="onSortChange($event)"
	>
		<admin-table-column header="Název alba" sort="name" [primary]="true" cellClass="albums-name-column" headerClass="align-middle albums-name-column">
			<ng-container *adminCell="let album">{{ album.name }}</ng-container>
		</admin-table-column>

		<admin-table-column header="Datum" sort="dateFrom" cellClass="date albums-date-column" headerClass="align-middle albums-date-column">
			<ng-container *adminCell="let album">
				{{ album.dateFrom | date: "d. M. y" }} - {{ album.dateTill | date: "d. M. y" }}
			</ng-container>
		</admin-table-column>

		<!-- Stav keeps its column position in the desktop table, but is flagged [right] so it
		     renders on the right of each item in the mobile list. -->
		<admin-table-column header="Stav" sort="status" [right]="true" cellClass="albums-status-column" headerClass="align-middle albums-status-column">
			<ng-container *adminCell="let album">
				<span class="bo-pill" [class.bo-pill-green]="album.status === 'public'">
					{{ album | album: "status" }}
				</span>
			</ng-container>
		</admin-table-column>

		<admin-table-column header="Publikováno" sort="datePublished" cellClass="albums-published-column" headerClass="align-middle albums-published-column">
			<ng-container *adminCell="let album">{{ album.datePublished | date: "d. M. y" }}</ng-container>
		</admin-table-column>
	</admin-table>

	<ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</bo-page-content>
