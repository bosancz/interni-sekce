<bo-page-header [title]="title()" backUrl="/galerie/kategorie" />

<bo-page-content [padding]="true">
	@if (photos(); as list) {
		@if (category(); as c) {
			<p class="cv-meta">{{ c.photosCount }} fotek, seřazené od nejpodobnějších</p>
		}
		@if (list.length) {
			<bo-photo-hits-grid [hits]="list" [showScore]="false" />
		} @else {
			<p class="cv-meta">V kategorii zatím nejsou žádné fotky.</p>
		}
		<ion-infinite-scroll [disabled]="!hasMore()" (ionInfinite)="loadMore($event)">
			<ion-infinite-scroll-content></ion-infinite-scroll-content>
		</ion-infinite-scroll>
	} @else {
		<div class="cv-loading"><ion-spinner name="dots"></ion-spinner></div>
	}
</bo-page-content>
