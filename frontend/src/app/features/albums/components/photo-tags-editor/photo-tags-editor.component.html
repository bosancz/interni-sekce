<div class="tags">
	@for (tag of availableTags(); track tag) {
		<ion-chip
			class="tag"
			[class.active]="hasTag(tag)"
			[outline]="!hasTag(tag)"
			color="warning"
			[disabled]="disabled()"
			(click)="toggleTag(tag)"
		>
			#{{ tag }}
		</ion-chip>
	}

	@if (!disabled()) {
		<ion-chip class="tag add" outline color="light" (click)="addTag()">
			<ion-icon name="add-outline"></ion-icon>
			Štítek
		</ion-chip>
	}
</div>
