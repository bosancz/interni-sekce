<div class="row numbers text-center my-5">
	<div class="col">
		<span class="number">{{ report()?.count || "-" }}</span>
		členů
	</div>
	@for (role of roles | keyvalue; track role.key) {
		<div class="col">
			<span class="number">{{ getRoleValue(role.key) }}</span>
			{{ role.value.genitiv }}
		</div>
	}
</div>

<div>
	@if (agesData()) {
		<canvas
			baseChart
			chartType="bar"
			width="800"
			height="300"
			[datasets]="agesData()!.datasets"
			[labels]="agesData()!.labels"
			[options]="agesOptions"
			[legend]="true"
		></canvas>
	}
</div>
