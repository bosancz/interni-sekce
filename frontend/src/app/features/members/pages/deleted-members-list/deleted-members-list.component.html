<bo-page-header title="Smazaní členové" backUrl="/databaze/clenove"></bo-page-header>

<bo-page-content>
	<admin-table
		[rows]="members()"
		[loading]="members() === undefined"
		[actions]="memberActions"
		[actionsHeader]="rowActionsHeader"
	>
		<admin-table-column header="Člen" [primary]="true" headerClass="align-middle">
			<ng-container *adminCell="let member">{{ memberName(member) }}</ng-container>
		</admin-table-column>

		<admin-table-column header="Oddíl" headerClass="align-middle">
			<ng-container *adminCell="let member">
				<bo-group-badge [groupId]="member.groupId"></bo-group-badge>
			</ng-container>
		</admin-table-column>

		<admin-table-column header="Smazáno" headerClass="align-middle">
			<ng-container *adminCell="let member">
				{{ member.deletedAt ? (member.deletedAt | date: "d. M. y H:mm") : "" }}
			</ng-container>
		</admin-table-column>
	</admin-table>

	@if (members()?.length === 0) {
		<p class="ion-padding members-empty">Žádní smazaní členové.</p>
	}
</bo-page-content>
