<bo-page-header [title]="getTitleName(member())" backUrl="/databaze" [actions]="actions()">
	@if (member(); as memberValue) {
		<bo-group-badge slot="title-end" class="ms-3" [groupId]="memberValue.groupId" />
	}
</bo-page-header>

<bo-page-content [padding]="true">
	<div class="layout d-lg-flex gap-4 mt-3">
		<div class="sidebar d-lg-block" [class.d-none]="view() !== 'profile'">
			<bo-member-profile [member]="member()" (change)="reloadMember()" class="mb-4" />

			<bo-vertical-menu class="d-none d-lg-block" defaultTab="profile" (change)="view.set($any($event))">
				<bo-vertical-menu-item name="profile" label="Profil" icon="person-circle-outline" />
				<bo-vertical-menu-item name="health" label="Zdraví" icon="medkit-outline" />
				<bo-vertical-menu-item name="contacts" label="Kontakty" icon="call-outline" />
				@if (member()?._links?.listMemberPhotos?.allowed) {
					<bo-vertical-menu-item name="photos" label="Fotky" icon="images-outline" />
				}
			</bo-vertical-menu>
		</div>

		<div class="content flex-grow-1">
			<div class="cards" [class.d-none]="view() !== 'profile'">
				<div class="card-col">
					<bo-member-info [member]="member()" (update)="updateMember($event)" />
				</div>

				<div class="card-col">
					<bo-member-membership
						[member]="member()"
						(update)="updateMember($event)"
						(updateMembership)="updateMemberMembership($event)"
					/>
				</div>

				<div class="card-col">
					<bo-member-payment [member]="member()" (updateMembership)="updateMemberMembership($event)" />
				</div>
			</div>

			<div class="card-col" [class.d-none]="view() !== 'health'">
				<bo-member-health [member]="member()" (update)="updateMember($event)" (reload)="reloadMember()" />
			</div>

			<div class="cards" [class.d-none]="view() !== 'contacts'">
				<div class="card-col">
					<bo-member-contact [member]="member()" (update)="updateMember($event)" />
				</div>

				<div class="card-col">
					<bo-member-contacts [member]="member()" (update)="updateMember($event)" />
				</div>
			</div>

			@if (member()?._links?.listMemberPhotos?.allowed) {
				<div class="photos-col" [class.d-none]="view() !== 'photos'">
					<bo-member-photos [member]="member()" />
				</div>
			}
		</div>
	</div>
</bo-page-content>

<bo-page-footer class="d-lg-none">
	<bo-tabs defaultTab="profile" (change)="view.set($any($event))">
		<bo-tab name="profile" label="Profil" icon="person-circle-outline"></bo-tab>
		<bo-tab name="health" label="Zdraví" icon="medkit-outline" color="var(--san-red)"></bo-tab>
		<bo-tab name="contacts" label="Kontakty" icon="call-outline"></bo-tab>
		@if (member()?._links?.listMemberPhotos?.allowed) {
			<bo-tab name="photos" label="Fotky" icon="images-outline"></bo-tab>
		}
	</bo-tabs>
</bo-page-footer>
