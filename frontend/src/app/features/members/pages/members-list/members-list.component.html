<bo-page-header title="Databáze" [actions]="actions()" />

<bo-people-filter
	[columns]="columns"
	[sortOptions]="sortOptions"
	[sort]="sortColumn()"
	[order]="sortOrder()"
	[showInactive]="showInactive()"
	(sortChange)="onSortChange($event)"
	(showInactiveChange)="setFilterParam('active', $event ? 'all' : null)"
>
	<ng-template boPeopleFilterPills>
		<bo-filter-pill
			label="Oddíl"
			[multiple]="false"
			[options]="groupOptions()"
			[selected]="selectedGroups()"
			(selectedChange)="setFilterParam('groups', $event)"
		/>
		<bo-filter-pill
			label="Role"
			[options]="roleOptions"
			[selected]="selectedRoles()"
			(selectedChange)="setFilterParam('roles', $event)"
		/>
		<bo-filter-pill
			label="Členství"
			[options]="membershipOptions"
			[selected]="selectedMembership()"
			(selectedChange)="setFilterParam('membership', $event)"
		/>
		<bo-filter-pill
			label="Ocenění"
			[options]="achievementOptions"
			[selected]="selectedAchievements()"
			(selectedChange)="setFilterParam('achievements', $event)"
		/>
	</ng-template>
</bo-people-filter>

<ion-content>
	<bo-people-table
		[rows]="members()"
		[loading]="members() === undefined"
		[visible]="columns.visible()"
		[rowLink]="rowLink"
		[rowClass]="rowClass"
		[actions]="memberActions"
		[actionsHeader]="rowActionsHeader"
		[sort]="sortColumn()"
		[order]="sortOrder()"
		(sortChange)="onSortChange($event)"
	/>

	@if (members()?.length) {
		<p class="ion-padding members-active-toggle">
			@if ((filter["active"] || "active") !== "all") {
				Zobrazeni pouze aktivní členové.
				<a class="clickable" (click)="setFilterParam('active', 'all')">Zobrazit i neaktivní</a>
			} @else {
				Zobrazeni všichni členové.
				<a class="clickable" (click)="setFilterParam('active', null)">Skrýt neaktivní</a>
			}
		</p>
	}

	@if (!members()) {
		<p class="ion-padding">
			Databáze je prázdná. Chceš <a class="clickable" (click)="create()">přidat prvního člena</a>?
		</p>
	}

	<ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</ion-content>
