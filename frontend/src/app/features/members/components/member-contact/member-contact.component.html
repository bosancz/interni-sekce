<bo-card class="bo-info-card">
	<bo-card-header>
		<bo-card-title>Kontakt na člena</bo-card-title>
	</bo-card-header>

	<bo-card-content>
		@if (member() === undefined) {
			<div class="bo-info-list">
				<div class="bo-info-row"><ion-skeleton-text [animated]="true"></ion-skeleton-text></div>
			</div>
		}

		@if (member(); as memberValue) {
			<div class="bo-info-list selectable">
				<bo-item label="Mobil">
					<span>{{ memberValue.mobile || "-" }}</span>
					<bo-icon-button
						slot="end"
						icon="call-outline"
						[href]="'tel:' + memberValue.mobile"
					></bo-icon-button>
					<bo-edit-button-text
						slot="end"
						type="tel"
						label="Mobil"
						placeholder="777 123 456"
						[disabled]="!memberValue._links.updateMember.allowed"
						[value]="memberValue.mobile"
						(update)="update.emit({ mobile: $event })"
					></bo-edit-button-text>
				</bo-item>

				<bo-item label="Email">
					<span>{{ memberValue.email || "-" }}</span>
					<bo-icon-button
						slot="end"
						icon="mail-outline"
						[href]="'mailto:' + memberValue.email"
					></bo-icon-button>
					<bo-edit-button-text
						slot="end"
						type="email"
						label="Email"
						placeholder="bilbo@bosan.cz"
						[disabled]="!memberValue._links.updateMember.allowed"
						[value]="memberValue.email"
						(update)="update.emit({ email: $event })"
					></bo-edit-button-text>
				</bo-item>
			</div>
		}
	</bo-card-content>
</bo-card>
