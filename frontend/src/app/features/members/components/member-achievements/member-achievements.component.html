<bo-card>
	<bo-card-header>
		<bo-card-title>
			<span class="bo-card-section-title">
				<ion-icon name="ribbon-outline" />
				Ocenění
			</span>
		</bo-card-title>
	</bo-card-header>

	<bo-card-content>
		<div class="badges">
			@if (achievements() === undefined) {
				@for (i of [1, 2]; track i) {
					<div class="badge skeleton"><ion-skeleton-text [animated]="true"></ion-skeleton-text></div>
				}
			} @else {
				@for (box of boxes(); track box.key) {
					<button
						type="button"
						class="badge"
						[class.editable]="canEdit()"
						[class.placeholder]="box.empty"
						[attr.aria-label]="getTooltip(box) ?? box.label"
						[boTooltip]="getTooltip(box)"
						[disabled]="box.empty && !canEdit()"
						(click)="open(box)"
					>
						<span class="badge-icon-wrap" [attr.data-stars]="box.stars.length">
							<img [src]="box.icon" alt="" class="badge-icon" />
							@for (star of box.stars; track star) {
								<img [src]="starIcon" alt="" class="badge-star" [attr.data-star]="star" />
							}
							@if (box.empty && canEdit()) {
								<span class="badge-add"><ion-icon name="add-outline"></ion-icon></span>
							}
						</span>
					</button>
				}
			}
		</div>
	</bo-card-content>
</bo-card>
