<div class="profile">
	<div class="avatar-wrapper">
		<ion-avatar
			class="avatar"
			[class.clickable]="!!member()?.profilePhoto"
			[class.colored]="!!member()?.groupId"
			[style.background-color]="member()?.groupId ? (member()!.groupId | group: 'color') : null"
			[attr.role]="member()?.profilePhoto ? 'button' : null"
			(click)="openSourcePhoto()"
		>
			@if (member() | memberProfilePhotoUrl; as src) {
				<img [src]="src" [alt]="member()!.nickname" />
			} @else if (member()) {
				<span>{{ member()! | member: "initials" }}</span>
			}
		</ion-avatar>

		@if (member()?._links?.updateMemberProfilePhoto?.applicable) {
			<button
				type="button"
				class="avatar-edit"
				[class.disabled]="!member()!._links.updateMemberProfilePhoto.allowed"
				[attr.aria-disabled]="!member()!._links.updateMemberProfilePhoto.allowed"
				[boTooltip]="
					member()!._links.updateMemberProfilePhoto.allowed
						? 'Změnit profilovou fotku'
						: 'Na změnu profilové fotky nemáš oprávnění.'
				"
				(click)="editProfilePhoto()"
			>
				<ion-icon name="camera-outline"></ion-icon>
			</button>
		}
	</div>
</div>
