<bo-card class="profile-card">
	<bo-card-content>
		<div class="profile">
			<ion-avatar class="avatar">
				@if (member()) {
					<span>{{ member()! | member: "initials" }}</span>
				}
			</ion-avatar>

			@if (member()?.nickname || member()?.firstName) {
				<div class="profile-name san selectable d-none d-xl-block">
					{{ member()?.nickname || member()?.firstName }}
				</div>
			}
		</div>
	</bo-card-content>
</bo-card>
