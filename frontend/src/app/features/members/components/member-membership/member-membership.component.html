<bo-card class="bo-info-card">
	<bo-card-header>
		<bo-card-title>Členství ve skupině</bo-card-title>
	</bo-card-header>

	<bo-card-content>
		@if (member() === undefined) {
			<div class="bo-info-list">
				<div class="bo-info-row"><ion-skeleton-text [animated]="true"></ion-skeleton-text></div>
			</div>
		}

		@if (member()) {
			@let memberValue = member()!;
			<div class="bo-info-list selectable">
				<bo-item label="Role">
					<span>{{ (memberValue | member: "role") || "-" }}</span>
					<bo-edit-button
						slot="end"
						[disabled]="!memberValue._links.updateMember.allowed"
						(click)="editRole()"
					/>
				</bo-item>

				<bo-item label="Členství">
					<span>{{ (memberValue | member: "membership") || "-" }}</span>
					@if (memberValue._links.updateMemberMembership.allowed) {
						<bo-edit-button slot="end" (click)="editMembership()" />
					}
				</bo-item>
			</div>
		}
	</bo-card-content>
</bo-card>
