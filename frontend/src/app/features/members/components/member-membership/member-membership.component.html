<bo-card>
	<bo-card-header>
		<bo-card-title>
			<span class="bo-card-section-title">
				<ion-icon name="people-outline" />
				Členství ve skupině
			</span>
		</bo-card-title>
	</bo-card-header>

	<bo-card-content>
		@if (member() === undefined) {
			<div class="bo-info-list">
				<div class="bo-info-row"><ion-skeleton-text [animated]="true"></ion-skeleton-text></div>
			</div>
		}

		@if (member()) {
			@let memberValue = member()!;
			<div class="bo-info-list selectable">
				<div class="bo-info-row">
					<span class="bo-info-label">Role</span>
					<span class="bo-info-action">
						<span class="bo-info-value">{{ (memberValue | member: "role") || "-" }}</span>
						<bo-edit-button [disabled]="!memberValue._links.updateMember.allowed" (click)="editRole()" />
					</span>
				</div>

				<div class="bo-info-row">
					<span class="bo-info-label">Členství </span>
					<span class="bo-info-action">
						<span class="bo-info-value">{{ (memberValue | member: "membership") || "-" }}</span>
						@if (memberValue._links.updateMemberMembership.allowed) {
							<bo-edit-button (click)="editMembership()" />
						}
					</span>
				</div>
			</div>
		}
	</bo-card-content>
</bo-card>
