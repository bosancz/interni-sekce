<bo-page-header title="Schvalování akcí" />
<bo-page-content [padding]="true">
	<ng-template #eventsColumn let-events>
		@for (event of events; track event.id) {
			<event-card
				[open]="true"
				[actions]="true"
				[event]="event"
				(change)="eventChanged($event)"
				class="mb-3"
			></event-card>
		}
		@if (!loading() && events?.length === 0) {
			<p class="text-center noevents">Žádné akce</p>
		}
	</ng-template>

	<div class="row no-gutters">
		<div class="col-12 col-xl-3 d-xl-block" [class.d-none]="selectedColumn() !== 'noLeader'">
			<ion-item lines="none" class="d-none d-xl-block column-heading">
				<ion-label><h2>Pan NIKDO</h2></ion-label>
				<ion-button color="primary">{{ noLeaderEvents()?.length }}</ion-button>
			</ion-item>
			<div class="column py-1 mx-xl-1">
				<ng-container *ngTemplateOutlet="eventsColumn; context: { $implicit: noLeaderEvents() }"></ng-container>
			</div>
		</div>

		<div class="col-12 col-xl-3 d-xl-block" [class.d-none]="selectedColumn() !== 'draft'">
			<ion-item lines="none" class="d-none d-xl-block column-heading">
				<ion-label><h2>V přípravě</h2></ion-label>
				<ion-button color="primary">{{ draftEvents()?.length }}</ion-button>
			</ion-item>
			<div class="column py-1 mx-xl-1">
				<ng-container *ngTemplateOutlet="eventsColumn; context: { $implicit: draftEvents() }"></ng-container>
			</div>
		</div>

		<div class="col-12 col-xl-3 d-xl-block" [class.d-none]="selectedColumn() !== 'pending'">
			<ion-item lines="none" class="d-none d-xl-block column-heading">
				<ion-label>
					<h2><strong>Ke schválení</strong></h2>
				</ion-label>
				<ion-button color="primary">{{ pendingEvents()?.length }}</ion-button>
			</ion-item>
			<div class="column py-1 mx-xl-1">
				<ng-container *ngTemplateOutlet="eventsColumn; context: { $implicit: pendingEvents() }"></ng-container>
			</div>
		</div>

		<div class="col-12 col-xl-3 d-xl-block" [class.d-none]="selectedColumn() !== 'public'">
			<ion-item lines="none" class="d-none d-xl-block column-heading">
				<ion-label><h2>V programu</h2></ion-label>
				<ion-button color="primary">{{ publicEvents()?.length }}</ion-button>
			</ion-item>
			<div class="column py-1 mx-xl-1">
				<ng-container *ngTemplateOutlet="eventsColumn; context: { $implicit: publicEvents() }"></ng-container>
			</div>
		</div>
	</div>

	<ion-infinite-scroll [disabled]="reachedEnd()" (ionInfinite)="onInfiniteScroll($any($event))">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</bo-page-content>

<bo-page-footer class="d-xl-none">
	<bo-tabs defaultTab="pending" (change)="selectedColumn.set($event)">
		<bo-tab name="noLeader" icon="help-circle-outline" label="NIKDO"></bo-tab>
		<bo-tab name="draft" icon="create-outline" label="V přípravě"></bo-tab>
		<bo-tab name="pending" icon="hourglass-outline" label="Ke schválení"></bo-tab>
		<bo-tab name="public" icon="calendar-outline" label="Program"></bo-tab>
	</bo-tabs>
</bo-page-footer>
