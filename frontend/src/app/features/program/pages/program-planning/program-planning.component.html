<bo-page-header title="Plánování akcí" />

<ion-content>
	<div class="row no-gutters">
		<div class="col-lg-3">
			<div class="px-lg-3 py-lg-3 pb-3">
				<bo-school-year-selector
					labelPosition="floating"
					[ngModel]="[dateFrom()?.toISODate(), dateTill()?.toISODate()]"
					(ngModelChange)="setPeriod($event)"
				></bo-school-year-selector>

				<bo-event-status-legend></bo-event-status-legend>
			</div>
		</div>

		<div class="col-lg-9">
			<div class="p-lg-3">
				@if (dateFrom() && dateTill()) {
					<bo-event-calendar
						(select)="createEvent($event)"
						[dateFrom]="dateFrom()!"
						[dateTill]="dateTill()!"
						[events]="events()"
						[cpv]="true"
						[selection]="true"
					></bo-event-calendar>
				}
			</div>
		</div>
	</div>
</ion-content>
