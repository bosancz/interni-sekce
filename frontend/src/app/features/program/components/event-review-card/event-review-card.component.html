@let e = event();
<bo-event-card [event]="e" [statusBar]="false" [link]="true">
	@if (e._links.rejectEvent.applicable || e._links.publishEvent.applicable) {
		<bo-card-footer class="footer" (click)="$event.stopPropagation()">
			@if (e._links.rejectEvent.applicable) {
				<button
					type="button"
					class="reject"
					[disabled]="!e._links.rejectEvent.allowed"
					(click)="action.emit('rejectEvent')"
				>
					K úpravám
				</button>
			}
			@if (e._links.publishEvent.applicable) {
				<button
					type="button"
					class="publish"
					[disabled]="!e._links.publishEvent.allowed"
					(click)="action.emit('publishEvent')"
				>
					Schválit do programu
				</button>
			}
		</bo-card-footer>
	}
</bo-event-card>
