<bo-card>
	<bo-card-header>
		<bo-card-title>
			<span class="bo-card-section-title">
				<ion-icon name="scan-outline" />
				Kontrola obličejů
			</span>
		</bo-card-title>
		@if (faceReview.review(); as r) {
			<span slot="buttons" class="fr-count">
				@if (faceReview.reviewed()) {
					hotovo {{ faceReview.reviewed() }},
				}
				zbývá {{ r.remaining }}
			</span>
		}
	</bo-card-header>

	<bo-card-content>
		<bo-face-review #faceReview />
	</bo-card-content>
</bo-card>
