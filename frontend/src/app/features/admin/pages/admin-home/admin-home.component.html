<bo-page-header backUrl="/" title="Administrace" />

<bo-page-content [padding]="true">
	<div class="p-1 p-lg-3">
		<div class="row nav-buttons">
			<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
				<bo-button-square
					routerLink="/admin/uzivatele"
					label="Uživatelé"
					color="var(--san-red)"
					tint="var(--bo-red-tint)"
					image="assets/img/button-databaze.svg"
				></bo-button-square>
			</div>
			<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
				<bo-button-square
					routerLink="/admin/obliceje"
					label="Detekce obličejů"
					color="var(--san-yellow)"
					tint="var(--bo-yellow-tint)"
					image="assets/img/button-galerie.svg"
				></bo-button-square>
			</div>
			<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
				<bo-button-square
					routerLink="/admin/prirazovani-obliceju"
					label="Přiřazování obličejů"
					color="var(--san-blue)"
					tint="var(--bo-blue-tint)"
					image="assets/img/button-akce.svg"
				></bo-button-square>
			</div>
			<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
				<bo-button-square
					routerLink="/admin/obsah-fotek"
					label="Obsah fotek"
					color="var(--san-red)"
					tint="var(--bo-red-tint)"
					image="assets/img/button-galerie.svg"
				></bo-button-square>
			</div>
			<div class="col-6 col-md-3 col-lg-6 col-xl-3 mb-4">
				<bo-button-square
					routerLink="/admin/workery"
					label="Workery"
					color="var(--san-green)"
					tint="var(--bo-green-tint)"
					image="assets/img/button-wiki.svg"
				></bo-button-square>
			</div>
		</div>
	</div>
</bo-page-content>
