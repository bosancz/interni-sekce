<bo-page-header title="Uživatelské účty" backUrl="/" [actions]="actions()" />

<bo-page-content>
	<bo-filter [search]="true" [showButtonMobileOnly]="true" [immediateFilter]="true">
		@if (isDesktop()) {
			<div toolbar-actions slot="end" class="users-filter-actions">
				<ng-container [ngTemplateOutlet]="filterPills"></ng-container>
			</div>
		} @else {
			<div>
				<div class="users-filter-modal">
					<ng-container [ngTemplateOutlet]="filterPills"></ng-container>
				</div>

				<bo-sort-select
					[options]="sortOptions"
					[sort]="sortColumn()"
					[order]="sortOrder()"
					(sortChange)="onSortChange($event)"
				/>
			</div>
		}
	</bo-filter>

	<ng-template #filterPills>
		<bo-filter-pill
			label="Role"
			[options]="roleOptions"
			[selected]="selectedRoles()"
			(selectedChange)="setFilterParam('roles', $event)"
		/>
	</ng-template>

	<admin-table
		[class]="'users-table'"
		[rows]="users()"
		[loading]="users() === undefined"
		[rowLink]="rowLink"
		[sort]="sortColumn()"
		[order]="sortOrder()"
		(sortChange)="onSortChange($event)"
	>
		<admin-table-column header="Login" sort="login" [primary]="true" headerClass="align-middle">
			<ng-container *adminCell="let user">{{ user.login }}</ng-container>
		</admin-table-column>

		<admin-table-column header="Člen" sort="member" headerClass="align-middle">
			<ng-container *adminCell="let user">
				@if (user.member) {
					{{ user.member.nickname || "-" }}
					<span class="users-member-name">{{ user.member.firstName }} {{ user.member.lastName }}</span>
				} @else {
					<span class="users-no-member">bez člena</span>
				}
			</ng-container>
		</admin-table-column>

		<admin-table-column header="E-mail" sort="email" headerClass="align-middle">
			<ng-container *adminCell="let user">{{ user.email }}</ng-container>
		</admin-table-column>

		<admin-table-column header="Role" headerClass="align-middle">
			<ng-container *adminCell="let user">
				<span class="users-roles">
					@for (role of user.roles | userRoles: "shown"; track role) {
						<span class="bo-pill" [class.bo-pill-blue]="role !== 'vedouci'">{{
							userRoles[role].title
						}}</span>
					}
				</span>
			</ng-container>
		</admin-table-column>
	</admin-table>

	<ion-infinite-scroll (ionInfinite)="onInfiniteScroll($any($event))">
		<ion-infinite-scroll-content></ion-infinite-scroll-content>
	</ion-infinite-scroll>
</bo-page-content>
