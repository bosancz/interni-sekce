services:
  backend:
    image: ghcr.io/bosancz/interni-sekce:latest
    ports:
      - 3000:3000
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_DATABASE_NAME: postgres
      DB_SCHEMA: public
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379
    volumes:
      - data:/data
    depends_on:
      - postgres
      - redis

  worker:
    image: ghcr.io/bosancz/interni-sekce-worker:latest
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WORKER_TASKS: detect-faces
    volumes:
      - data:/data:ro
    cpus: 2
    mem_limit: 1g
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  data:
  redis:
  postgres:
