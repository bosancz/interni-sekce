services:
  backend:
    image: ghcr.io/bosancz/interni-sekce:latest
    ports:
      - 3000:3000
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_DATABASE_NAME: postgres
      DB_SCHEMA: public
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/bosancz/interni-sekce-worker:latest
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WORKER_TASKS: detect-faces,embed-photo
    volumes:
      - data:/data:ro
    cpus: 2
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy

  worker-text:
    image: ghcr.io/bosancz/interni-sekce-worker:latest
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WORKER_TASKS: embed-text,match-faces
    volumes:
      - data:/data:ro
    cpus: 1
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data

  postgres:
    image: ghcr.io/bosancz/interni-sekce-postgres:latest
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  data:
  redis:
  postgres:
