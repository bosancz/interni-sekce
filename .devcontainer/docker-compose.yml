name: bosan_interni_sekce_development

services:
  devcontainer:
    build: .
    command: sleep infinity
    environment:
      ENV_TITLE: "DEV"
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_DATABASE: postgres
      DB_SCHEMA: public
      REDIS_URL: redis://redis:6379
      CORS_ENABLE: "true"
      CORS_ORIGINS: "http://localhost:4200,http://localhost:4300"

  postgres:
    build:
      context: ..
      target: postgres
    environment:
      POSTGRES_PASSWORD: password

  redis:
    image: redis:7-alpine

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
    depends_on:
      - postgres
